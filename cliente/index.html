<!DOCTYPE html>
<html>
<head>
  <title>Socket.IO chat</title>
  <style>
    body {
      margin: 0;
      padding-bottom: 3rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #form {
      background: rgba(0, 0, 0, 0.15);
      padding: 0.25rem;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      height: 3rem;
      box-sizing: border-box;
      backdrop-filter: blur(10px);
    }

    #input {
      border: none;
      padding: 0 1rem;
      flex-grow: 1;
      border-radius: 2rem;
      margin: 0.25rem;
    }

    #input:focus {
      outline: none;
    }

    #form > button {
      background: #333;
      border: none;
      padding: 0 1rem;
      margin: 0.25rem;
      border-radius: 3px;
      outline: none;
      color: #fff;
    }

    #messages {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }

    #messages > li {
      padding: 0.5rem 1rem;
    }

    #messages > li:nth-child(odd) {
      background: #efefef;
    }

    .emoji {
      position: absolute;
      font-size: 2rem;
      animation: float 3s ease-out forwards;
      pointer-events: none;
      z-index: 999;
    }

    @keyframes float {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-200px) rotate(720deg) scale(0.5);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <ul id="messages"></ul>
  <form id="form" action="">
    <input id="input" autocomplete="off" /><button>Send</button>
  </form>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    var socket = io('http://localhost:3000');
    let form = document.getElementById('form');
    let input = document.getElementById('input');
    let messages = document.getElementById('messages');

    let emojiCount = 50; // Comienza con 50 emojis por mensaje, se incrementará con el tiempo

    function randomEmojiExplosion() {
      const emojis = ['😂', '🔥', '🦄', '🍕', '💩', '👻', '🌈', '🐸', '🧀', '🚀', '🥑', '🎩', '🎉', '💀', '🧠', '🍄', '🛸'];
      
      // Cada vez que se recibe un mensaje, aumentamos la cantidad de emojis generados
      for (let i = 0; i < emojiCount; i++) {
        let emoji = document.createElement('div');
        emoji.classList.add('emoji');
        emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        emoji.style.left = Math.random() * window.innerWidth + 'px';
        emoji.style.top = (window.innerHeight - 60) + 'px';
        document.body.appendChild(emoji);
      }

      // Cada vez que se genera una "explosión", se incrementa el contador
      emojiCount += 10; // Aumentar la cantidad de emojis generados con cada mensaje
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (input.value) {
        socket.emit('chat message', input.value);
        input.value = '';
      }
    });

    socket.on('chat message', function (msg) {
      let item = document.createElement('li');
      item.textContent = msg;
      messages.appendChild(item);
      window.scrollTo(0, document.body.scrollHeight);
      randomEmojiExplosion(); // 💥 cada vez que hay un mensaje
    });
  </script>
</body>
</html>
